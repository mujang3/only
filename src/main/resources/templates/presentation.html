<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온리 : ONLY — AI 스마트 난방</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif;
            background: #071426;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 배경 글로우 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 800px 600px at 70% 50%, rgba(59,143,232,0.10) 0%, transparent 60%),
                radial-gradient(ellipse 400px 400px at 10% 80%, rgba(59,143,232,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .showcase {
            width: 100%;
            max-width: 1280px;
            min-height: 100vh;
            padding: 64px 96px;
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
        }

        /* ── 왼쪽 텍스트 ── */
        .showcase-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-right: 60px;
        }

        .platform-tag {
            display: inline-block;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 6px;
            width: fit-content;
            letter-spacing: 0.03em;
        }

        .desc-main {
            font-size: 19px;
            font-weight: 500;
            color: rgba(255,255,255,0.88);
            line-height: 1.75;
            word-break: keep-all;
        }

        .desc-sub {
            font-size: 17px;
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            line-height: 1.85;
            word-break: keep-all;
        }

        .brand-row {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2E76C8 0%, #1A4F8A 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(46,118,200,0.4);
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.02em;
        }

        .brand-name em {
            color: #5BA3F0;
            font-style: normal;
        }

        /* ── 오른쪽 폰 목업 ── */
        .showcase-right {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-wrap {
            position: relative;
        }

        .phone-outer {
            width: 290px;
            height: 608px;
            background: #0E1C30;
            border-radius: 46px;
            border: 2px solid rgba(255,255,255,0.10);
            box-shadow:
                0 0 0 6px #0A1222,
                0 0 0 7px rgba(255,255,255,0.06),
                0 40px 100px rgba(0,0,0,0.7),
                0 0 80px rgba(59,143,232,0.12);
            overflow: hidden;
            position: relative;
        }

        /* 노치 */
        .phone-outer::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 26px;
            background: #0A1222;
            border-radius: 20px;
            z-index: 10;
        }

        .phone-iframe-wrap {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 44px;
        }

        .phone-iframe-wrap iframe {
            width: 390px;
            height: 844px;
            border: none;
            transform: scale(0.744);
            transform-origin: top left;
            pointer-events: none;
        }

        /* 슬라이드 번호 */
        .slide-num {
            position: fixed;
            bottom: 32px;
            right: 48px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.05em;
        }

        /* 팀명 */
        .team-name {
            position: fixed;
            top: 32px;
            right: 48px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.12em;
        }
    </style>
</head>
<body>

    <div class="team-name">YOONSEUL</div>

    <div class="showcase">

        <!-- 왼쪽 텍스트 -->
        <div class="showcase-left">

            <div class="platform-tag">플랫폼</div>

            <p class="desc-main">
                체감온도 기반 AI 분석과 핑거봇 자동 실행을 통해<br>
                구형 보일러도 교체 없이 스마트하게 제어하고<br>
                가스비를 절감하는 서비스를 제공
            </p>

            <p class="desc-sub">
                가스비 부담을 줄이고 싶은 1인 가구를 실현하기 위한,<br>
                ASHRAE 55 논문 기반 최적 체감온도 분석과<br>
                IoT 핑거봇 물리 버튼 제어를 연결하는<br>
                스마트 난방 자동화 프로젝트
            </p>

            <div class="brand-row">
                <div class="brand-icon">🌡️</div>
                <div class="brand-name"><em>온리</em> : ONLY</div>
            </div>

        </div>

        <!-- 오른쪽 폰 목업 -->
        <div class="showcase-right">
            <div class="phone-wrap">
                <div class="phone-outer">
                    <div class="phone-iframe-wrap">
                        <iframe src="/main" scrolling="no" title="온리 : ONLY 앱 미리보기"></iframe>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="slide-num">7</div>

</body>
</html>
