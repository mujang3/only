<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 설정 도우미 — ONLY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<div class="phone">

    <div class="topbar">
        <a href="/main" class="rv-back">&#8592;</a>
        <div class="topbar-logo">ON<em>LY</em> <span class="topbar-badge">AI 설정 도우미</span></div>
        <div style="width:40px"></div>
    </div>

    <!-- 고민 선택 -->
    <div class="concern-picker" id="concern-picker">
        <div class="concern-hero">
            <img src="/images/robot.png" width="80" alt="온리">
            <div class="concern-hero-title">어떤 고민이 있으세요?</div>
            <div class="concern-hero-sub">AI가 맞춤 해결책을 찾아드려요</div>
        </div>
        <div class="concern-cards">
            <button class="concern-card" onclick="startChat('savings')">
                <span class="cc-icon">💸</span>
                <div class="cc-txt">
                    <div class="cc-title">가스비가 너무 많이 나와요</div>
                    <div class="cc-sub">절약 패턴 분석 + 맞춤 설정</div>
                </div>
                <span class="cc-arrow">›</span>
            </button>
            <button class="concern-card" onclick="startChat('cold')">
                <span class="cc-icon">🥶</span>
                <div class="cc-txt">
                    <div class="cc-title">집이 자꾸 추워요</div>
                    <div class="cc-sub">원인 분석 + 최적 온도 설정</div>
                </div>
                <span class="cc-arrow">›</span>
            </button>
            <button class="concern-card" onclick="startChat('auto')">
                <span class="cc-icon">⏰</span>
                <div class="cc-txt">
                    <div class="cc-title">자동화 설정하고 싶어요</div>
                    <div class="cc-sub">외출·귀가 스마트 제어</div>
                </div>
                <span class="cc-arrow">›</span>
            </button>
            <button class="concern-card" onclick="startChat('boiler')">
                <span class="cc-icon">🔧</span>
                <div class="cc-txt">
                    <div class="cc-title">보일러가 이상하게 작동해요</div>
                    <div class="cc-sub">증상 진단 + 설정 교정</div>
                </div>
                <span class="cc-arrow">›</span>
            </button>
            <button class="concern-card" onclick="startChat('general')">
                <span class="cc-icon">💬</span>
                <div class="cc-txt">
                    <div class="cc-title">그냥 대화로 설정하기</div>
                    <div class="cc-sub">처음부터 차근차근</div>
                </div>
                <span class="cc-arrow">›</span>
            </button>
        </div>
    </div>

    <div class="chat-body" id="chat-body" style="display:none">
        <!-- 메시지가 여기에 동적으로 추가됩니다 -->
    </div>

    <div class="chat-apply-wrap" id="apply-wrap" style="display:none">
        <button class="chat-apply-btn" onclick="applySettings()">
            설정 적용하고 시작하기 →
        </button>
    </div>

    <div class="chat-input-area" id="chat-input-area" style="display:none">
        <input type="text" id="chat-input" class="chat-input"
               placeholder="메시지를 입력하세요..."
               onkeydown="if(event.key==='Enter')sendMessage()"
               disabled>
        <button class="chat-send-btn" id="send-btn" onclick="sendMessage()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

</div>
<script src="/js/chat.js"></script>
</body>
</html>
